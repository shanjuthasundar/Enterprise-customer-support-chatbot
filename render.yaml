services:
  - type: web
    name: enterprise-customer-support-chatbot
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: KINDRED_ENV
        value: production
      - key: KINDRED_CORS_ORIGINS
        value: https://enterprise-customer-support-chatbot.onrender.com
